services:
  - type: web
    name: fastsas-smart-ai
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: fastsas-db
          property: connectionString
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_GLOBAL_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5

databases:
  - name: fastsas-db
    plan: free
    region: frankfurt
    databaseName: fastsas
    user: fastsas
