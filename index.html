<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المساعد الذكي للمتاجر</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm border-b border-slate-100 py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">منصة المساعد الذكي</h1>
            <span class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-medium">SaaS WhatsApp Bot</span>
        </div>
    </header>

    <main class="max-w-2xl mx-auto w-full p-6 my-8 bg-white rounded-2xl shadow-sm border border-slate-100">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">تسجيل متجر جديد</h2>
            <p class="text-sm text-slate-500">أدخل تفاصيل متجرك وارفع كتالوج المنتجات لتفعيل مساعد الواتساب الذكي فوراً.</p>
        </div>

        <form id="storeForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">اسم المتجر *</label>
                <input type="text" id="store_name" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">رابط المتجر (اختياري)</label>
                <input type="url" id="store_url" placeholder="https://example.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">رقم الواتساب (مع رمز الدولة)</label>
                <input type="text" id="whatsapp_number" placeholder="+967XXXXXXXXX" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">تعليمات المساعد الذكي (Prompt Notes)</label>
                <textarea id="agent_notes" rows="3" placeholder="مثال: كن ودوداً، ركز على بيع المنتجات التقنية..." class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">كتالوج المنتجات والأسعار (ملف PDF)</label>
                <input type="file" id="pdf_file" accept=".pdf" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition duration-200 text-sm shadow-sm">
                تسجيل وتفعيل المتجر
            </button>
        </form>

        <div id="resultBox" class="hidden mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl">
            <h3 class="text-emerald-800 font-bold mb-2">تم بنجاح!</h3>
            <p id="resultMessage" class="text-xs text-emerald-700 mb-3"></p>
            <div id="qrContainer" class="text-center my-3 hidden">
                <p class="text-xs font-semibold text-slate-600 mb-2">امسح كود الواتساب لربط الحساب:</p>
                <img id="qrCodeImg" src="" alt="WhatsApp QR Code" class="mx-auto max-w-[200px] rounded-lg border border-slate-200">
            </div>
            <div class="mt-3">
                <label class="block text-xs font-bold text-slate-600 mb-1">كود الودجت للموقع:</label>
                <input type="text" id="widgetCodeOutput" readonly class="w-full bg-white px-3 py-2 rounded border border-slate-200 text-xs select-all text-slate-600">
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-400">
        جميع الحقوق محفوظة &copy; 2026
    </footer>

    <script>
        document.getElementById('storeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'جاري المعالجة والتسجيل...';

            const formData = new FormData();
            formData.append('store_name', document.getElementById('store_name').value);
            formData.append('store_url', document.getElementById('store_url').value);
            formData.append('whatsapp_number', document.getElementById('whatsapp_number').value);
            formData.append('agent_notes', document.getElementById('agent_notes').value);
            
            const pdfFile = document.getElementById('pdf_file').files[0];
            if (pdfFile) {
                formData.append('pdf_file', pdfFile);
            }

            try {
                const response = await fetch('/api/register-store', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('resultBox').classList.remove('hidden');
                    document.getElementById('resultMessage').textContent = data.message;
                    document.getElementById('widgetCodeOutput').value = data.widget_code;

                    if (data.qr_code) {
                        document.getElementById('qrContainer').classList.remove('hidden');
                        document.getElementById('qrCodeImg').src = data.qr_code;
                    }
                } else {
                    alert('حدث خطأ أثناء التسجيل');
                }
            } catch (error) {
                console.error(error);
                alert('فشل الاتصال بالخادم');
            } finally {
                btn.disabled = false;
                btn.textContent = 'تسجيل وتفعيل المتجر';
            }
        });
    </script>
</body>
</html>
